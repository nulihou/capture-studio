# Build the Windows portable zip when a version tag is pushed, and attach it to that Release.
# The desktop build needs Windows (PyInstaller + a Windows FFmpeg). Linux agents cannot produce the exe.
name: Windows portable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r capture_studio/requirements.txt pyinstaller pefile

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src
          $exe = Get-ChildItem -Recurse ffmpeg-src -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe was not in the archive" }
          "FFMPEG_BIN=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build portable zip
        run: python capture_studio/build_portable.py --ffmpeg-bin "$env:FFMPEG_BIN"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: capture_studio/dist/CaptureStudio_v*.zip
          # v0.13.0 notes. Later tags can point body_path at their own note.
          body_path: capture_studio/V13_NOTES.md
          draft: false
          fail_on_unmatched_files: true
